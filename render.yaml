services:
  # Web Service that runs both frontend and backend
  - type: web
    name: growny-ai
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && mkdir -p ../backend/static && cp -r dist/* ../backend/static/
    startCommand: cd backend && python main.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: NODE_VERSION
        value: "18"
      # Add your environment variables in Render Dashboard
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GMAIL_SENDER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: FIREBASE_ADMIN_SDK_PATH
        value: ./firebase-admin-sdk.json
    healthCheckPath: /api/health

  # Cron Job to trigger email checks (runs every 5 minutes)
  # On free tier, this also keeps the service alive
  - type: cron
    name: growny-email-checker
    runtime: python
    schedule: "*/5 * * * *"
    buildCommand: pip install requests
    startCommand: python -c "import requests; r = requests.get('https://growny-ai.onrender.com/api/cron/check-emails'); print(r.json())"
